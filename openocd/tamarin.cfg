# Tamarin Interface Configuration
# For Apple T8015 Debugging
# OpenOCD v0.12.0+ compatible
#
# Bench config used to drive a Raspberry Pi Pico running Tamarin firmware
# as the SWD adapter against an iPhone X (A11/T8015).
# Requires an OpenOCD build with the Tamarin probe driver
# ("adapter driver tamarin").

# ======================
# 1. Core Configuration
# ======================
interface tamarin
adapter driver tamarin
transport select swd

# ======================
# 2. Speed Settings
# ======================
# Base configuration
adapter speed 5000
# Fallback speeds for troubleshooting
jtag_rclk 1000
swd_khz 5000

# ======================
# 3. Protocol Tuning
# ======================
# SWD-specific optimizations
swd wcr_swap false
swd line_reset true
swd delayed_retry true

# ======================
# 4. Hardware Validation
# ======================
proc validate_interface {} {
    # Check interface capabilities
    if {[capture "interface list"] eq ""} {
        echo "ERROR: Interface communication failed!"
        shutdown error
    }

    # Verify SWD protocol support
    if {[transport list] ne "swd"} {
        echo "ERROR: SWD transport not available!"
        shutdown error
    }
}

# ======================
# 5. Event Handlers
# ======================
# Clean shutdown procedure
adapter srst pulse_width 250
adapter srst delay 50

$_INTERFACE configure -event shutdown {
    adapter speed 1000
    jtag_rclk 1000
    reset_config none
}

# ======================
# 6. Error Handling
# ======================
# Retry configuration for flaky connections
adapter retries 3
adapter error_limit 5

# ======================
# 7. Initialization
# ======================
# Interface startup sequence
proc init_sequence {} {
    validate_interface
    adapter speed 5000
    reset_config srst_only
    adapter srst deasserted
}

# Run initialization on startup
init_sequence
