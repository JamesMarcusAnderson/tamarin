# Tamarin SWD interface configuration
#
# Probe: Raspberry Pi Pico (RP2040 / RP2350) running Tamarin firmware,
#        or the Tamarin Cable (stacksmashing/tamarin-firmware).
# Target: Apple T8015 (A11) via SWD.
#
# REQUIRES the stacksmashing/openocd-tamarin OpenOCD fork, which provides
# the "tamarin" adapter driver. Mainline OpenOCD does not include it.
#
# Usage:
#   openocd -f openocd/tamarin.cfg -f openocd/t8015.cfg

# Adapter driver from the Tamarin fork (NOT valid in mainline OpenOCD).
# NOTE: `adapter driver tamarin` is the 0.11+ spelling; this project was
# built against the fork's 0.10/0.12-era tree where `interface` is correct.
interface tamarin

# SWD only. Do not add JTAG commands (e.g. jtag_rclk) here: with the
# transport set to SWD, any JTAG-only command aborts startup with
# 'session transport is "swd" but your config requires JTAG'.
transport select swd

# Adapter clock. 10 MHz is the fastest stable rate observed on this bench.
# Fall back to 5000, then 1000, if the DPIDR read is unstable.
adapter_khz 10000

# Create the SWD TAP for the T8015.
#   -irlen 6            : ARM SWD-DP instruction register length
#   -expected-id        : TAP IDCODE check; aborts if the ID does not match.
#                        0x4ba02477 is the converged T8015 value from bring-up.
# NOTE: `swj_newdap` is the pre-0.10 spelling and is rejected by current
# OpenOCD ("invalid command name"). Use `swd newdap`.
swd newdap t8015 cpu -irlen 6 -expected-id 0x4ba02477

# iPhone X exposes SRST only; TRST is not wired to the debug port.
reset_config srst_only
