# Apple T8015 (A11) full core/SEP configuration.
#
# UNVERIFIED — adapted from the Bonobo SWD reference config
# (docs.bonoboswd.com). Core debug/CTI base addresses below are
# Bonobo's values, NOT confirmed against a live T8015 in this project.
# Bring up t8015.cfg first; enable this file only after the single-core
# session is stable, and validate each base address before trusting it.
#
# Pairs with openocd/tamarin.cfg (provides the `t8015.cpu` TAP).
# Source AFTER t8015.cfg, or standalone:
#   openocd -f openocd/tamarin.cfg -f openocd/t8015-cores.cfg
#
# Corrections applied vs. the Bonobo original:
#   - `swj_newdap` -> `swd newdap` (old spelling rejected by OpenOCD >= 0.10)
#   - `interface bonobo` removed (interface belongs in tamarin.cfg)
#   - SEP target completed (was truncated in the reference)
#   - `-ctibase` kept for the 0.10/0.12-era fork; OpenOCD 0.12+ prefers
#     `-baseaddr` and warns on `-ctibase`.

if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME t8015
}

if { [info exists ENDIAN] } {
    set _ENDIAN $ENDIAN
} else {
    set _ENDIAN little
}

if { [info exists CPUTAPID] } {
    set _CPUTAPID $CPUTAPID
} else {
    set _CPUTAPID 0x4ba02477
}

# DAP bound to the TAP created by `swd newdap` in tamarin.cfg.
# -ignore-syspwrupack: the A11 debug power domain may not assert
# SYSRESETREQ/PWRUPACK cleanly; without this, DAP init can stall.
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu -ignore-syspwrupack

# MEM-APs: AP 1 = debug bus, AP 4 = system/memory bus (Bonobo's mapping).
target create $_CHIPNAME.dbg mem_ap -endian $_ENDIAN -dap $_CHIPNAME.dap -ap-num 1
target create $_CHIPNAME.mem mem_ap -endian $_ENDIAN -dap $_CHIPNAME.dap -ap-num 4

# E-cores (efficiency cluster). Bases are UNVERIFIED Bonobo values.
cti create $_CHIPNAME.ecore0.cti -dap $_CHIPNAME.dap -ap-num 1 -ctibase 0xc8020000
target create $_CHIPNAME.ecore0 aarch64 -endian $_ENDIAN -dap $_CHIPNAME.dap -ap-num 1 -dbgbase 0xc8010000 -cti $_CHIPNAME.ecore0.cti

cti create $_CHIPNAME.ecore1.cti -dap $_CHIPNAME.dap -ap-num 1 -ctibase 0xc8120000
target create $_CHIPNAME.ecore1 aarch64 -endian $_ENDIAN -dap $_CHIPNAME.dap -ap-num 1 -dbgbase 0xc8110000 -cti $_CHIPNAME.ecore1.cti

cti create $_CHIPNAME.ecore2.cti -dap $_CHIPNAME.dap -ap-num 1 -ctibase 0xc8220000
target create $_CHIPNAME.ecore2 aarch64 -endian $_ENDIAN -dap $_CHIPNAME.dap -ap-num 1 -dbgbase 0xc8210000 -cti $_CHIPNAME.ecore2.cti

cti create $_CHIPNAME.ecore3.cti -dap $_CHIPNAME.dap -ap-num 1 -ctibase 0xc8320000
target create $_CHIPNAME.ecore3 aarch64 -endian $_ENDIAN -dap $_CHIPNAME.dap -ap-num 1 -dbgbase 0xc8310000 -cti $_CHIPNAME.ecore3.cti

# P-cores (performance cluster). Bases are UNVERIFIED Bonobo values.
cti create $_CHIPNAME.pcore0.cti -dap $_CHIPNAME.dap -ap-num 1 -ctibase 0xc8420000
target create $_CHIPNAME.pcore0 aarch64 -endian $_ENDIAN -dap $_CHIPNAME.dap -ap-num 1 -dbgbase 0xc8410000 -cti $_CHIPNAME.pcore0.cti

cti create $_CHIPNAME.pcore1.cti -dap $_CHIPNAME.dap -ap-num 1 -ctibase 0xc8520000
target create $_CHIPNAME.pcore1 aarch64 -endian $_ENDIAN -dap $_CHIPNAME.dap -ap-num 1 -dbgbase 0xc8510000 -cti $_CHIPNAME.pcore1.cti

# SMP group across all application cores. Left disabled until each
# core target is individually validated.
# target smp $_CHIPNAME.ecore0 $_CHIPNAME.ecore1 $_CHIPNAME.ecore2 $_CHIPNAME.ecore3 $_CHIPNAME.pcore0 $_CHIPNAME.pcore1

# Secure Enclave Processor. UNVERIFIED: reachable only on a demoted
# device; AP number and CTI base are Bonobo's values. The Bonobo
# reference truncated this target; the -ap-num 4 / -ctibase below
# complete it per the reference's own CTI line.
cti create $_CHIPNAME.sep.cti -dap $_CHIPNAME.dap -ap-num 4 -ctibase 0x242020000
target create $_CHIPNAME.sep aarch64 -endian $_ENDIAN -dap $_CHIPNAME.dap -ap-num 4 -cti $_CHIPNAME.sep.cti
# TODO: SEP dbgbase unknown. Do not attach until validated on hardware.
