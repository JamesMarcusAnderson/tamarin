# Apple T8015 (A11) target configuration for OpenOCD over SWD.
#
# Pairs with openocd/tamarin.cfg, which creates the `t8015.cpu` TAP.
# For the full multi-core / SEP configuration, see t8015-cores.cfg.
#
# Usage:
#   openocd -f openocd/tamarin.cfg -f openocd/t8015.cfg
# Then, in a second terminal (telnet localhost 4444):
#   init
#   aarch64 dbginit
#   reset halt
#   mdw 0x2102BC000 1      ;# demotion register: 0x00000000 = demoted

if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME t8015
}

if { [info exists CPUTAPID] } {
    set _CPUTAPID $CPUTAPID
} else {
    # T8015 TAP IDCODE, converged during bring-up.
    # (Distinct from the SWD DPIDR; see README.)
    set _CPUTAPID 0x4ba02477
}

if { [info exists ENDIAN] } {
    set _ENDIAN $ENDIAN
} else {
    set _ENDIAN little
}

# DAP bound to the TAP created by `swd newdap` in tamarin.cfg.
# NOTE: `dap create` takes -chain-position (referencing the TAP).
# `target create` takes -dap (referencing the DAP) -- mixing them up
# fails with "target requires -dap parameter instead of -chain-position".
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

# Main application CPU target (A11).
target create $_CHIPNAME.cpu aarch64 -endian $_ENDIAN -dap $_CHIPNAME.dap

# Memory AP for direct memory access without halting a core.
target create $_CHIPNAME.mem mem_ap -endian $_ENDIAN -dap $_CHIPNAME.dap

# On every reset, halt immediately and kill the E-core watchdogs so the
# halted state survives. Without this, GDB drops with
# "Core.0 failed to shut down" as the watchdogs revive the cores.
$_CHIPNAME.cpu configure -event reset-init {
    halt
    mww 0x2102BC000 0x0  ;# E-core 0 watchdog kill (A11)
    mww 0x2102BD000 0x0  ;# E-core 1 watchdog kill (A11)
    # TODO: extend to E-core 2/3 and P-cores once their watchdog
    # addresses are confirmed on hardware (see t8015-cores.cfg).
}

# NOTE: no `init`, `reset halt`, or `mdw` here on purpose. Config files
# define the session; the operator drives it from telnet/GDB. Baking
# `init` into a target config makes `-c` overrides and scripted
# sessions fail in confusing ways.
