<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1000" font-family="sans-serif">
  <title>Tamarin bring-up flowchart</title>
  <style>
    .title { font-size: 20px; font-weight: bold; fill: #111; }
    .box { fill: #ffffff; stroke: #333; stroke-width: 2; }
    .step { font-size: 14px; font-weight: bold; fill: #111; }
    .detail { font-family: monospace; font-size: 12px; fill: #444; }
    .diamond { fill: #fefce8; stroke: #a16207; stroke-width: 2; }
    .dlabel { font-size: 13px; font-weight: bold; fill: #713f12; }
    .edge { font-size: 12px; fill: #111; font-style: italic; }
    .bad { font-size: 12px; fill: #b91c1c; font-weight: bold; }
    .good { font-size: 12px; fill: #166534; font-weight: bold; }
    .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#333"/>
    </marker>
  </defs>

  <text x="460" y="34" text-anchor="middle" class="title">Tamarin bring-up flowchart</text>

  <!-- steps -->
  <g id="steps">
    <rect x="330" y="60" width="260" height="64" rx="8" class="box"/>
    <text x="460" y="86" text-anchor="middle" class="step">1. Jailbreak + demote iPhone X</text>
    <text x="460" y="108" text-anchor="middle" class="detail">palera1n.sh --tweaks 15.5 --demote</text>

    <rect x="330" y="150" width="260" height="64" rx="8" class="box"/>
    <text x="460" y="176" text-anchor="middle" class="step">2. Flash the Pico probe</text>
    <text x="460" y="198" text-anchor="middle" class="detail">tamarin-firmware (.uf2 via BOOTSEL)</text>

    <rect x="330" y="240" width="260" height="64" rx="8" class="box"/>
    <text x="460" y="266" text-anchor="middle" class="step">3. Build OpenOCD fork</text>
    <text x="460" y="288" text-anchor="middle" class="detail">stacksmashing/openocd-tamarin</text>

    <rect x="330" y="330" width="260" height="64" rx="8" class="box"/>
    <text x="460" y="356" text-anchor="middle" class="step">4. Wire probe → target</text>
    <text x="460" y="378" text-anchor="middle" class="detail">SWDIO · SWCLK · GND</text>

    <rect x="330" y="420" width="260" height="64" rx="8" class="box"/>
    <text x="460" y="446" text-anchor="middle" class="step">5. Start OpenOCD</text>
    <text x="460" y="468" text-anchor="middle" class="detail">-f tamarin.cfg -f t8015.cfg</text>
  </g>

  <!-- arrows 1-5 -->
  <line x1="460" y1="124" x2="460" y2="150" class="arrow"/>
  <line x1="460" y1="214" x2="460" y2="240" class="arrow"/>
  <line x1="460" y1="304" x2="460" y2="330" class="arrow"/>
  <line x1="460" y1="394" x2="460" y2="420" class="arrow"/>

  <!-- DPIDR diamond -->
  <line x1="460" y1="484" x2="460" y2="520" class="arrow"/>
  <polygon points="460,520 590,580 460,640 330,580" class="diamond"/>
  <text x="460" y="576" text-anchor="middle" class="dlabel">DPIDR?</text>
  <text x="460" y="596" text-anchor="middle" class="dlabel" font-size="11">check startup log</text>

  <!-- good branch -->
  <line x1="590" y1="580" x2="700" y2="580" class="arrow"/>
  <text x="645" y="572" text-anchor="middle" class="good">0x0bc11477</text>
  <rect x="700" y="548" width="180" height="64" rx="8" class="box"/>
  <text x="790" y="574" text-anchor="middle" class="step">6. Drive session</text>
  <text x="790" y="596" text-anchor="middle" class="detail">telnet :4444 → init…</text>

  <!-- bad branch -->
  <line x1="460" y1="640" x2="460" y2="700" class="arrow"/>
  <text x="470" y="676" class="bad">0x00000001</text>
  <rect x="330" y="700" width="260" height="80" rx="8" class="box" style="stroke:#b91c1c"/>
  <text x="460" y="726" text-anchor="middle" class="step" fill="#b91c1c">DP dormant — debug</text>
  <text x="460" y="748" text-anchor="middle" class="detail">wiring · demotion · power</text>
  <text x="460" y="766" text-anchor="middle" class="detail">adapter_khz 1000</text>

  <!-- step 7 -->
  <line x1="790" y1="612" x2="790" y2="660" class="arrow"/>
  <rect x="660" y="660" width="260" height="64" rx="8" class="box"/>
  <text x="790" y="686" text-anchor="middle" class="step">7. mdw 0x2102BC000 1</text>
  <text x="790" y="708" text-anchor="middle" class="detail">demotion register</text>

  <!-- demotion diamond -->
  <line x1="790" y1="724" x2="790" y2="760" class="arrow"/>
  <polygon points="790,760 900,810 790,860 680,810" class="diamond"/>
  <text x="790" y="806" text-anchor="middle" class="dlabel">demoted?</text>

  <line x1="790" y1="860" x2="790" y2="896" class="arrow"/>
  <text x="800" y="884" class="good">0x00000000</text>

  <line x1="680" y1="810" x2="600" y2="810" class="arrow"/>
  <text x="640" y="802" text-anchor="middle" class="bad">0x00010206</text>
  <rect x="420" y="778" width="180" height="64" rx="8" class="box" style="stroke:#b91c1c"/>
  <text x="510" y="804" text-anchor="middle" class="step" fill="#b91c1c">Not demoted</text>
  <text x="510" y="826" text-anchor="middle" class="detail">redo step 1</text>

  <!-- success box -->
  <rect x="660" y="896" width="260" height="64" rx="8" class="box" style="stroke:#166534"/>
  <text x="790" y="922" text-anchor="middle" class="step" fill="#166534">Stable session</text>
  <text x="790" y="944" text-anchor="middle" class="detail">GDB → :3333 · mdw/mww · bp</text>
</svg>
